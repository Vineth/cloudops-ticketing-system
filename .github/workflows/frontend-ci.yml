name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start FastAPI and PostgreSQL
        run: docker compose up -d --build backend

      - name: Wait for FastAPI
        run: |
          curl -fsS --retry 15 --retry-all-errors --retry-delay 2 \
            --max-time 5 --output /dev/null http://localhost:8000/health

      - name: Verify tickets endpoint
        shell: bash
        run: |
          curl -fsS --max-time 10 http://localhost:8000/tickets \
            | jq -e 'type == "array"'

      - name: Show logs if the smoke test fails
        if: failure()
        run: docker compose logs --no-color backend postgres

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Verify ticket lifecycle
        shell: bash
        run: |
          api_url=http://localhost:8000

          echo "Create a ticket"
          ticket=$(curl -fsS --max-time 10 -X POST "$api_url/tickets" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test","description":"Created by GitHub Actions","priority":"medium","status":"open"}')
          ticket_id=$(jq -er '.id | numbers' <<< "$ticket")
          ticket_url="$api_url/tickets/$ticket_id"

          echo "Read the ticket"
          curl -fsS --max-time 10 "$ticket_url" \
            | jq -e '.title == "CI smoke test" and .status == "open"'

          echo "Update the status and read it back"
          curl -fsS --max-time 10 -X PUT "$ticket_url" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test","description":"Created by GitHub Actions","priority":"medium","status":"resolved"}'
          curl -fsS --max-time 10 "$ticket_url" \
            | jq -e '.status == "resolved"'

          echo "Delete the ticket and verify it is gone"
          curl -fsS --max-time 10 -X DELETE "$ticket_url"
          status_code=$(curl -sS --max-time 10 -o /dev/null \
            -w '%{http_code}' "$ticket_url")
          if [[ "$status_code" != 404 ]]; then
            echo "Expected HTTP 404 after deletion, got $status_code"
            exit 1
          fi